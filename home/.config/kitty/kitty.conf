# Kitty: Tech Console
# Reversible trial; the previous configuration is kitty.conf.before-tech.

# Typography
font_family JetBrainsMono Nerd Font Mono
font_size 12.5
bold_font auto
italic_font auto
bold_italic_font auto
adjust_line_height 2

# Palette
include ./kitty-themes/Tech-Console.conf

# Window surface
background_opacity 0.92
dynamic_background_opacity yes
window_padding_width 10
draw_minimal_borders yes
confirm_os_window_close 0
linux_display_server auto

# Cursor
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.6
cursor_stop_blinking_after 15

# Tabs
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template {index}: {title}
active_tab_font_style bold
inactive_tab_font_style normal
hide_window_decorations titlebar-only

# History and interaction
scrollback_lines 10000
wheel_scroll_min_lines 1
enable_audio_bell no
visual_bell_duration 0.15
url_style straight

# Let terminal applications distinguish Shift+Enter from Enter.
map shift+enter send_text all \x1b[13;2u

# Convenient live font controls.
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+backspace change_font_size all 0
