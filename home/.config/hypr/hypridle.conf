# Hypridle power-saving policy
# 9 min: warning, 10 min: lock, then suspend exactly 1 minute after lock.

$iDIR="$HOME/.config/swaync/images/ja.png"
$lockNow="$HOME/.config/hypr/scripts/LockNow.sh"
$lockSuspend="$HOME/.config/hypr/scripts/LockSuspend.sh"

general {
    lock_cmd = $lockNow
    on_lock_cmd = $lockSuspend arm
    on_unlock_cmd = $lockSuspend cancel
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

listener {
    timeout = 540
    on-timeout = notify-send -i $iDIR "Idle warning" "Locking in one minute"
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Save panel power shortly after the automatic lock.
listener {
    timeout = 630
    on-timeout = pidof hyprlock && hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
