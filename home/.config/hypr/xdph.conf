# xdg-desktop-portal-hyprland: screen sharing (Google Meet, Zoom, Discord, OBS…)
# @HOME@ is replaced with the real home directory by scripts/deploy.sh.
# Changes take effect after: systemctl --user restart xdg-desktop-portal-hyprland

screencopy {
    # Visual picker with live thumbnails; falls back to hyprland-share-picker on error.
    custom_picker_binary = @HOME@/.config/hypr/scripts/SharePicker.py
    # Pre-tick "Remember this choice" so apps can re-share without asking again.
    allow_token_by_default = false
    max_fps = 30
}
