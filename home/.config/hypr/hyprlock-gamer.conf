    position = -320, -240
    halign = center
    valign = center
    zindex = 4
}

# RIGHT DECK // action console.
shape {
    monitor =
    size = 470, 570
    color = rgba(3, 5, 9, 0.72)
    rounding = 14
    border_size = 2
    border_color = rgba(255, 35, 62, 0.42)
