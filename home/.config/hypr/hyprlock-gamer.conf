# External HUD telemetry.
label {
    monitor =
    text = cmd[update:600000] sh -c 'printf "ATMOS // "; if [ -r "$HOME/.cache/.weather_cache" ]; then sed -n "3p" "$HOME/.cache/.weather_cache"; else printf "OFFLINE"; fi'
    color = $cyan
    font_size = 15
    font_family = $mono
    position = 52, 28
    halign = left
    valign = bottom
    zindex = 4
}

label {
    monitor =
    text = LOCKED // MOVE CURSOR + CLICK CONTROLS
    color = $red
    font_size = 15
    font_family = $mono
    position = -52, 28
    halign = right
    valign = bottom
    zindex = 4
}
