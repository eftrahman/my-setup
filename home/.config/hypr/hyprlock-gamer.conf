# REDLINE // LOCKDOWN
# A large asymmetrical gaming HUD for Hyprlock 0.9.x.

$font = JetBrainsMono Nerd Font
$mono = JetBrainsMono Nerd Font Mono
$confirm = $HOME/.config/hypr/scripts/LockConfirm.sh

$black = rgba(2, 3, 6, 0.96)
$panel = rgba(7, 9, 14, 0.92)
$panel_solid = rgba(11, 13, 20, 0.98)
$red = rgba(255, 35, 62, 1.0)
$red_soft = rgba(255, 35, 62, 0.18)
$orange = rgba(255, 132, 42, 1.0)
$cyan = rgba(38, 225, 255, 1.0)
$green = rgba(51, 255, 153, 1.0)
$white = rgba(246, 248, 255, 1.0)
$muted = rgba(143, 153, 177, 1.0)
$dim = rgba(69, 76, 95, 1.0)

general {
    hide_cursor = false
    ignore_empty_input = true
    fractional_scaling = 2
    immediate_render = true
}

animations {
    enabled = true
    bezier = snap, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 5, snap
    animation = fadeOut, 1, 3, snap
    animation = inputFieldDots, 1, 3, snap
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = $black
    blur_size = 9
    blur_passes = 5
    noise = 0.035
    contrast = 1.35
    brightness = 0.20
    vibrancy = 0.30
    vibrancy_darkness = 0.25
    zindex = -5
}

# Wide command-deck silhouette.
shape {
    monitor =
    size = 1260, 740
    color = rgba(255, 35, 62, 0.025)
    rounding = 30
    border_size = 3
    border_color = $red $orange 45deg
    shadow_passes = 6
    shadow_size = 34
    shadow_color = rgba(255, 0, 30, 0.28)
    shadow_boost = 1.35
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

shape {
    monitor =
    size = 1218, 698
    color = $panel
    rounding = 22
    border_size = 1
    border_color = rgba(255, 60, 80, 0.34)
    position = 0, 0
    halign = center
    valign = center
    zindex = 1
}

# Angled corner armor gives the frame a less conventional card silhouette.
shape {
    monitor =
    size = 150, 9
    color = $red
    rounding = 2
    rotate = -24
    position = -570, 322
    halign = center
    valign = center
    zindex = 3
}

shape {
    monitor =
    size = 150, 9
    color = $orange
    rounding = 2
    rotate = -24
    position = 570, -322
    halign = center
    valign = center
    zindex = 3
}

# Top HUD rail.
shape {
    monitor =
    size = 1120, 5
    color = $red $orange 90deg
    rounding = 2
    position = 0, 291
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = R // REDLINE LOCKDOWN
    color = $red
    font_size = 24
    font_family = $mono
    position = 72, -42
    halign = left
    valign = top
    zindex = 4
}

label {
    monitor =
    text = cmd[update:60000] date +"%A // %d %B %Y"
    color = $muted
    font_size = 18
    font_family = $mono
    position = -72, -45
    halign = right
    valign = top
    zindex = 4
}

# Center divider and glowing reactor node.
shape {
    monitor =
    size = 4, 570
    color = rgba(255, 35, 62, 0.62)
    rounding = 2
    position = 15, -10
    halign = center
    valign = center
    zindex = 3
}

shape {
    monitor =
    size = 22, 22
    color = $red
    rounding = -1
    border_size = 4
    border_color = rgba(255, 255, 255, 0.72)
    position = 15, 220
    halign = center
    valign = center
    zindex = 4
}

# LEFT DECK // player authentication.
label {
    monitor =
    text = PLAYER ONE // <span foreground="##2ce1ff"><b>$USER</b></span>
    color = $white
    font_size = 20
    font_family = $mono
    position = -320, 240
    halign = center
    valign = center
    zindex = 4
}

label {
    monitor =
    text = $TIME
    color = $red
    font_size = 104
    font_family = $mono
    shadow_passes = 5
    shadow_size = 14
    shadow_color = rgba(255, 0, 30, 0.38)
    position = -330, 125
    halign = center
    valign = center
    zindex = 4
}

label {
    monitor =
    text = cmd[update:1000] date +"%S"
    color = $orange
    font_size = 25
    font_family = $mono
    position = -64, 148
    halign = center
    valign = center
    zindex = 4
}

label {
    monitor =
    text = AUTHENTICATION CHANNEL
    color = $muted
    font_size = 14
    font_family = $mono
    position = -320, 35
    halign = center
    valign = center
    zindex = 4
}

input-field {
    monitor =
    size = 520, 78
    outline_thickness = 3
    rounding = 8
    dots_size = 0.30
    dots_spacing = 0.30
    dots_center = true
    dots_rounding = -1
    outer_color = $red $orange 90deg
    inner_color = $panel_solid
    check_color = $green $cyan 90deg
    fail_color = $red $orange 90deg
    font_color = $white
    font_family = $mono
    fade_on_empty = false
    hide_input = false
    placeholder_text = <span foreground="##8f99b1"><b>ENTER ACCESS KEY</b></span>
    check_text = <span foreground="##33ff99"><b>ACCESSING...</b></span>
    fail_text = <span foreground="##ff233e"><b>ACCESS DENIED // $PAMFAIL</b></span>
    capslock_color = $orange
    shadow_passes = 4
    shadow_size = 14
    shadow_color = rgba(255, 20, 48, 0.22)
    position = -320, -38
    halign = center
    valign = center
    zindex = 5
}

label {
    monitor =
    text = KEYMAP // <span foreground="##2ce1ff">$LAYOUT</span>     ENTER // UNLOCK
    color = $muted
    font_size = 13
    font_family = $mono
    position = -320, -101
    halign = center
    valign = center
    zindex = 4
}

# Left-side diagnostic blocks.
shape {
    monitor =
    size = 520, 3
    color = rgba(255, 35, 62, 0.45)
    rounding = 1
    position = -320, -137
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = SEC // ON
    color = $green
    font_size = 15
    font_family = $mono
    position = -495, -177
    halign = center
    valign = center
    zindex = 4
}

label {
    monitor =
    text = DPMS // 30S
    color = $cyan
    font_size = 15
    font_family = $mono
    position = -320, -177
    halign = center
    valign = center
    zindex = 4
}

label {
    monitor =
    text = SLEEP // 60S
    color = $orange
    font_size = 15
    font_family = $mono
    position = -145, -177
    halign = center
    valign = center
    zindex = 4
}

label {
    monitor =
