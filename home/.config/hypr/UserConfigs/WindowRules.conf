# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates

# Searchable shortcut command center launched from Waybar.
windowrule = match:class ^(ShortcutGuide.py)$, float on, center on, size (monitor_w*0.72) (monitor_h*0.78)

# Visual clipboard history browser launched from Super+V and Waybar.
windowrule = match:class ^(ClipboardLibrary.py)$, float on, center on, size (monitor_w*0.76) (monitor_h*0.80)

# Wi-Fi, saved connections, and hotspot control panel launched from Waybar.
windowrule = match:class ^(NetworkCenter.py)$, float on, center on, size (monitor_w*0.62) (monitor_h*0.72)

# Screen-share picker (Google Meet etc.): float above everything on the current workspace.
windowrule = match:class ^(SharePicker.py)$, float on, center on, pin on, stay_focused on, size (monitor_w*0.60) (monitor_h*0.70)

# Screenshot annotation editor (Super+Shift+S, or "Edit" on the screenshot notification).
windowrule = match:class ^(ScreenshotEditor.py)$, float on, center on, size (monitor_w*0.80) (monitor_h*0.82)

# Workspace overview (Super+A).
windowrule = match:class ^(WorkspaceOverview.py)$, float on, center on, pin on, stay_focused on, dim_around on, size (monitor_w*0.86) (monitor_h*0.84)

# Sound Center: outputs, mic, per-app volume (click the Waybar volume module).
windowrule = match:class ^(SoundCenter.py)$, float on, center on, size (monitor_w*0.56) (monitor_h*0.70)

# Bluetooth Center (click the Waybar Bluetooth icon; hidden when there is no adapter).
windowrule = match:class ^(BluetoothCenter.py)$, float on, center on, size (monitor_w*0.50) (monitor_h*0.70)
