# Hyprlock: Secure Console
# Personal 1080p tech-themed lock screen

$font = JetBrainsMono Nerd Font
$font_mono = JetBrainsMono Nerd Font Mono

$panel = rgba(8, 12, 20, 0.86)
$panel_inner = rgba(13, 18, 29, 0.94)
$outline = rgba(168, 139, 250, 0.38)
$text = rgba(232, 239, 249, 1.0)
$muted = rgba(137, 149, 171, 1.0)
$cyan = rgba(103, 232, 249, 1.0)
$violet = rgba(167, 139, 250, 1.0)
$green = rgba(114, 230, 191, 1.0)
$amber = rgba(240, 198, 116, 1.0)
$red = rgba(255, 107, 129, 1.0)

general {
    hide_cursor = false
    ignore_empty_input = true
    fractional_scaling = 2
    immediate_render = true
}

animations {
    enabled = true
    bezier = consoleEase, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, consoleEase
    animation = fadeOut, 1, 3, consoleEase
    animation = inputFieldDots, 1, 2, consoleEase
}

# Dark, blurred version of the current wallpaper.
background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = rgba(6, 8, 14, 1.0)
    blur_size = 7
    blur_passes = 4
    noise = 0.018
    contrast = 1.15
    brightness = 0.42
    vibrancy = 0.26
    vibrancy_darkness = 0.16
    zindex = -2
}

# Outer console frame.
shape {
    monitor =
    size = 720, 450
    color = rgba(0, 0, 0, 0.0)
    rounding = 29
    border_size = 2
    border_color = $cyan $violet 135deg
    shadow_passes = 4
    shadow_size = 18
    shadow_color = rgba(0, 0, 0, 0.65)
    shadow_boost = 1.3
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

# Main translucent console surface.
shape {
    monitor =
    size = 684, 414
    color = $panel
    rounding = 23
    border_size = 1
    border_color = $outline
    position = 0, 0
    halign = center
    valign = center
    zindex = 1
}

# Top status rail inside the console.
shape {
    monitor =
    size = 620, 2
    color = rgba(103, 232, 249, 0.72)
    rounding = 2
    position = 0, 166
    halign = center
    valign = center
    zindex = 2
}

# Lower status rail.
shape {
    monitor =
    size = 620, 1
    color = rgba(167, 139, 250, 0.46)
    rounding = 2
    position = 0, -156
    halign = center
    valign = center
    zindex = 2
}

# Global top-left security status.
label {
    monitor =
    text = <span foreground="##67e8f9">◆</span>  SECURE SESSION <span foreground="##596274">//</span> HYPR NODE
    color = $text
    font_size = 14
    font_family = $font_mono
    position = 42, -34
    halign = left
    valign = top
    zindex = 3
}

# Global date telemetry.
label {
    monitor =
    text = cmd[update:60000] date +"%A  //  %d %B %Y"
    color = $muted
    font_size = 14
    font_family = $font_mono
    position = -42, -34
    halign = right
    valign = top
    zindex = 3
}

# Console mode heading.
label {
    monitor =
    text = <span foreground="##67e8f9">[</span> SYSTEM LOCKED <span foreground="##67e8f9">]</span>
    color = $text
    font_size = 15
    font_family = $font_mono
    position = 0, 187
    halign = center
    valign = center
    zindex = 4
}

# Main 24-hour clock.
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 96
    font_family = $font_mono
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.62)
    position = -20, 83
    halign = center
    valign = center
    zindex = 4
}

# Separate seconds readout for a terminal-clock feel.
label {
    monitor =
    text = cmd[update:1000] date +"%S"
    color = $cyan
    font_size = 24
    font_family = $font_mono
    position = 205, 110
    halign = center
    valign = center
    zindex = 4
}

label {
    monitor =
    text = LOCAL
    color = $muted
    font_size = 10
    font_family = $font_mono
    position = 205, 82
    halign = center
    valign = center
    zindex = 4
}

# Current identity.
label {
    monitor =
    text = IDENTITY <span foreground="##596274">//</span> <span foreground="##a78bfa">$USER</span>
    color = $muted
    font_size = 15
    font_family = $font_mono
    position = 0, 5
    halign = center
    valign = center
    zindex = 4
}

# Authentication field.
input-field {
    monitor =
    size = 480, 58
    outline_thickness = 2
    rounding = 10
    dots_size = 0.22
    dots_spacing = 0.28
    dots_center = true
    dots_rounding = -1
    outer_color = $cyan $violet 90deg
    inner_color = $panel_inner
    check_color = $green $cyan 90deg
    fail_color = $red rgba(255, 154, 92, 1.0) 90deg
    font_color = $text
    font_family = $font_mono
    fade_on_empty = false
    hide_input = false
    placeholder_text = <span foreground="##7f8ba3">ENTER ACCESS KEY</span>
    check_text = <span foreground="##72e6bf">AUTHENTICATING...</span>
    fail_text = <span foreground="##ff6b81">ACCESS DENIED  //  $PAMFAIL</span>
    capslock_color = rgba(240, 198, 116, 1.0)
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.55)
    position = 0, -82
    halign = center
    valign = center
    zindex = 5
}

# Keyboard layout and action hint.
label {
    monitor =
    text = KEYMAP <span foreground="##596274">//</span> <span foreground="##67e8f9">$LAYOUT</span>     ENTER <span foreground="##596274">//</span> AUTHENTICATE
    color = $muted
    font_size = 11
    font_family = $font_mono
    position = 0, -130
    halign = center
    valign = center
    zindex = 4
}

# Session controls.
shape {
    monitor =
    size = 150, 34
    color = rgba(103, 232, 249, 0.07)
    rounding = 8
    border_size = 1
    border_color = rgba(103, 232, 249, 0.42)
    position = -174, -183
    halign = center
    valign = center
    onclick = hyprctl dispatch exit 0
    zindex = 3
}

label {
    monitor =
    text = ↪  LOG OUT
    color = $cyan
    font_size = 11
    font_family = $font_mono
    position = -174, -183
    halign = center
    valign = center
    onclick = hyprctl dispatch exit 0
    zindex = 4
}

shape {
    monitor =
    size = 150, 34
    color = rgba(240, 198, 116, 0.07)
    rounding = 8
    border_size = 1
    border_color = rgba(240, 198, 116, 0.42)
    position = 0, -183
    halign = center
    valign = center
    onclick = systemctl reboot
    zindex = 3
}

label {
    monitor =
    text = ↻  RESTART
    color = $amber
    font_size = 11
    font_family = $font_mono
    position = 0, -183
    halign = center
    valign = center
    onclick = systemctl reboot
    zindex = 4
}

shape {
    monitor =
    size = 150, 34
    color = rgba(255, 107, 129, 0.07)
    rounding = 8
    border_size = 1
    border_color = rgba(255, 107, 129, 0.42)
    position = 174, -183
    halign = center
    valign = center
    onclick = systemctl poweroff
    zindex = 3
}

label {
    monitor =
    text = ⏻  SHUTDOWN
    color = $red
    font_size = 11
    font_family = $font_mono
    position = 174, -183
    halign = center
    valign = center
    onclick = systemctl poweroff
    zindex = 4
}

# Weather telemetry, reduced to the useful temperature line.
label {
    monitor =
    text = cmd[update:600000] sh -c 'printf "ATMOS // "; if [ -r "$HOME/.cache/.weather_cache" ]; then sed -n "3p" "$HOME/.cache/.weather_cache"; else printf "OFFLINE"; fi'
    color = $cyan
    font_size = 13
    font_family = $font_mono
    position = 42, 30
    halign = left
    valign = bottom
    zindex = 3
}

# Uptime telemetry.
label {
    monitor =
    text = cmd[update:60000] sh -c 'printf "UPTIME // "; uptime -p | sed "s/^up //"'
    color = $muted
    font_size = 13
    font_family = $font_mono
    position = -42, 30
    halign = right
    valign = bottom
    zindex = 3
}

# Bottom-center recovery hint.
label {
    monitor =
    text = ESC <span foreground="##596274">//</span> CLEAR BUFFER
    color = $muted
    font_size = 11
    font_family = $font_mono
    position = 0, 30
    halign = center
    valign = bottom
    zindex = 3
}
